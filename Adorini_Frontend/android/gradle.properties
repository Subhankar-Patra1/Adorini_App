# The Flutter template ships -Xmx8G with a 4G metaspace, which asks for up to
# 12G for the Gradle daemon alone — more than a 16G machine has free once
# Windows, the IDE and the Kotlin daemon are accounted for. The Kotlin daemon
# then gets starved and dies partway through writing its incremental caches,
# surfacing as the misleading "Could not close incremental caches in ..."
# failure rather than as an out-of-memory error.
#
# 4G heap is comfortable for a Flutter app of this size, and kotlin.daemon.jvmargs
# gives the Kotlin compiler its own bounded budget instead of inheriting nothing.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx2G

# Kotlin's incremental compiler fails to close its own cache files on this
# Windows setup ("Could not close incremental caches in ...\caches-jvm\jvm\kotlin"),
# breaking compilation of the plugin modules (url_launcher_android,
# package_info_plus, video_player_android) even from a clean build directory —
# a file-locking problem, not a code problem.
#
# Incremental compilation only speeds up *rebuilds* of Kotlin sources, and this
# project has no Kotlin of its own — only the plugins' — so switching it off
# costs a few seconds per build and makes the build work at all.
kotlin.incremental=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
org.gradle.java.home=C:\\Program Files\\Android\\Android Studio\\jbr
