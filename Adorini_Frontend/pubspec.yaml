name: adorini_frontend
description: Adorini ethnic wear shopping app.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.4.3+1

  # Routing
  go_router: ^14.2.0

  # Icons
  flutter_svg: ^2.0.10+1

  # Media
  cached_network_image: ^3.3.1
  video_player: ^2.9.1
  chewie: ^1.8.3

  # Local storage
  flutter_secure_storage: ^9.2.2

  # Integrations
  url_launcher: ^6.3.0

  # Utils
  intl: ^0.19.0

  cupertino_icons: ^1.0.8
  path_drawing: ^1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Sentient (headings) and Clash Grotesk (body/label — the lower levels) are
  # not on Google Fonts, so both ship as bundled assets.
  fonts:
    - family: Sentient
      fonts:
        - asset: assets/fonts/Sentient-Medium.otf
          weight: 500
        - asset: assets/fonts/Sentient-Bold.otf
          weight: 700
    - family: ClashGrotesk
      fonts:
        - asset: assets/fonts/ClashGrotesk-Medium.otf
          weight: 500
        - asset: assets/fonts/ClashGrotesk-Bold.otf
          weight: 700

  assets:
    - assets/images/
    - assets/icons/
