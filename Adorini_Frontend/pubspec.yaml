name: adorini_frontend
description: Adorini ethnic wear shopping app.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.4.3+1

  # Routing
  go_router: ^14.2.0

  # Typography & icons
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1

  # Media
  cached_network_image: ^3.3.1
  video_player: ^2.9.1
  chewie: ^1.8.3

  # Local storage
  flutter_secure_storage: ^9.2.2

  # Integrations
  url_launcher: ^6.3.0

  # Utils
  intl: ^0.19.0

  cupertino_icons: ^1.0.8
  path_drawing: ^1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Outfit is loaded via google_fonts at runtime; no bundled font files needed.

  assets:
    - assets/images/
    - assets/icons/
